esphome:
  name: dts6012m-node

esp32:
  board: denky32
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG
  logs:
    dts6012m: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
- platform: esphome
  password: !secret ota_password

wifi:
  use_address: !secret ip_address
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: True

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "LiDAR_Fallback"
    password: !secret wifi_fallback_outside
    # ap_timeout: 1min

i2c:
  sda: 21
  scl: 18
  scan: false
  # optional: lower clock if unstable
  frequency: 10kHz

captive_portal:

external_components:
  - source: ./custom_components
    components: [dts6012m]

dts6012m:
  update_interval: 5s
  retries: 3
  wakeup_time: 20ms
  powerup_time: 250ms
  sleep_between_updates: true
  distance:
    name: "DTS6012M Distance"

sensor: